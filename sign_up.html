<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إنشاء حساب - نقطة وصل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style.css" />
</head>

<body class="auth-page">

  <!-- خلفية مثل صفحة الدخول -->
  <section class="auth-hero auth-hero--searcher">
    <div class="auth-hero__overlay"></div>

    <!-- Top bar -->
    <div class="auth-top">
      <div class="auth-brand">نقطة وصل</div>
      <a class="auth-back" href="index.html" aria-label="رجوع">›</a>
    </div>

    <!-- Center card -->
    <div class="auth-wrap">
      <div class="auth-card">
        <h2 class="auth-title">إنشاء حساب</h2>

        <div id="step1" class="auth-step">
          <label class="auth-label" for="national_id">الهوية الوطنية (10 أرقام)</label>
          <input id="national_id" class="auth-input" inputmode="numeric" placeholder="10XXXXXXXXX">

          <label class="auth-label" for="full_name">الاسم كامل</label>
          <input id="full_name" class="auth-input" placeholder="الاسم كامل">


          <label class="auth-label" for="phone">رقم الجوال</label>
          <input id="phone" class="auth-input" inputmode="tel" placeholder="05XXXXXXXX">

          <label class="auth-label" for="email">الإيميل (اختياري)</label>
          <input id="email" class="auth-input" inputmode="email" placeholder="name@email.com">

          <label class="auth-label" for="role">نوع الحساب</label>
          <select id="role" class="auth-input auth-select">
            <option value="searcher">باحث</option>
            <option value="owner">مالك عقار</option>
          </select>

          <button id="sendOtp" class="auth-btn">إرسال رمز التحقق</button>

          <p class="auth-link">
            لديك حساب؟ <a href="login.html">سجّل دخول</a>
          </p>
        </div>

        <div id="step2" class="auth-step" style="display:none;">
          <label class="auth-label" for="otp">رمز التحقق</label>
          <input id="otp" class="auth-input" inputmode="numeric" placeholder="******">

          <button id="verifyOtp" class="auth-btn">تأكيد</button>

          <!-- هذا نخليه موجود بس فاضي (ما نعرض OTP) -->
          <p id="hint" class="auth-hint"></p>
        </div>

        <p id="msg" class="auth-msg"></p>
      </div>
    </div>

    <!-- Footer -->
    <div class="auth-footer">Qassim, Buraydah ©2026 — نقطة وصل</div>
  </section>


<!-- ================================================== -->
<!-- ================= Script ========================= -->

<script>
const msg = document.getElementById("msg");
const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const hint = document.getElementById("hint");

document.getElementById("sendOtp").addEventListener("click", async () => {
  msg.textContent = "";
 // hint.textContent = ""; // ✅ لا نعرض OTP

  const data = {
    national_id: document.getElementById("national_id").value.trim(),
    full_name: document.getElementById("full_name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    email: document.getElementById("email").value.trim(),
    role: document.getElementById("role").value
  };

  // ================= VALIDATION =================

// الهوية الوطنية
if (!/^\d{10}$/.test(data.national_id)) {
  msg.textContent = "رقم الهوية يجب أن يكون 10 أرقام";
  return;
}

// رقم الجوال
if (!/^05\d{8}$/.test(data.phone)) {
 msg.textContent = "رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام";
  return;
}

// الإيميل (إذا المستخدم كتبه)
if (
  data.email &&
  !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)
) {
  msg.textContent = "صيغة الإيميل غير صحيحة";
  return;
}
  try {
    const r = await fetch("http://127.0.0.1:3001/api/auth/signup/start", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });

    const j = await r.json();
    if (!r.ok) throw new Error(j.message || "خطأ");

    step1.style.display = "none";
    step2.style.display = "block";
  } catch (e) {
    msg.textContent = e.message;
  }
});

document.getElementById("verifyOtp").addEventListener("click", async () => {
  msg.textContent = "";

  const phone = document.getElementById("phone").value.trim();
  const code = document.getElementById("otp").value.trim();

  try {
    const r = await fetch("http://127.0.0.1:3001/api/auth/signup/verify", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
       credentials: "include",
      body: JSON.stringify({ phone, code })
    });

    const j = await r.json();
    if (!r.ok) throw new Error(j.message || "خطأ");

    localStorage.setItem("user", JSON.stringify(j.user));
    window.location.href = j.redirect;
  } catch (e) {
    msg.textContent = e.message;
  }
});
</script>

</body>
</html>
