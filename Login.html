<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول - نقطة وصل</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="Style.css" />
</head>

<body class="auth-page">

  <!-- خلفية مثل صورة الهيرو -->
  <header class="auth-hero auth-hero--searcher">
    <div class="auth-hero__overlay"></div>

    <!-- شريط علوي (نقطة وصل + رجوع) -->
    <div class="auth-top">
      <div class="auth-brand">نقطة وصل</div>
      <a class="auth-back" href="index.html" aria-label="رجوع">›</a>
    </div>

    <!-- الكرت -->
    <main class="auth-wrap">
      <section class="auth-card" aria-label="تسجيل الدخول">
        <h2 class="auth-title">تسجيل الدخول</h2>

        <!-- Step 1 -->
        <div id="step1" class="auth-step">
          <label class="auth-label" for="phone">رقم الجوال</label>
          <input id="phone" class="auth-input" placeholder="05xxxxxxxx" inputmode="numeric" autocomplete="tel">

          <button id="sendOtp" class="auth-btn" type="button">إرسال OTP</button>

          <p class="auth-link">
            ما عندك حساب؟ <a href="sign_up.html">إنشاء حساب</a>
          </p>
        </div>

        <!-- Step 2 -->
        <div id="step2" class="auth-step" style="display:none;">
          <label class="auth-label" for="otp">رمز التحقق</label>
          <input id="otp" class="auth-input" placeholder="******" inputmode="numeric" autocomplete="one-time-code">

          <button id="verifyOtp" class="auth-btn" type="button">تأكيد</button>

          <!-- ✅ ما نعرض OTP هنا -->
          <p id="hint" class="auth-hint"></p>
        </div>

        <p id="msg" class="auth-msg"></p>
      </section>
    </main>

    <footer class="auth-footer">
      <div>Qassim, Buraydah ©2026 — نقطة وصل</div>
    </footer>
  </header>


<!-- ================================================== -->
<!-- ================= Script ========================= -->
 
<script>
const msg = document.getElementById("msg");
const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const hint = document.getElementById("hint");

function showError(text){
  msg.textContent = text || "";
}

document.getElementById("sendOtp").addEventListener("click", async () => {
  showError("");
  hint.textContent = ""; // ✅ ما نعرض OTP

  const phone = document.getElementById("phone").value.trim();

  try {
    const r = await fetch("http://127.0.0.1:3001/api/auth/login/start", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ phone })
    });

    const j = await r.json().catch(()=> ({}));
    if (!r.ok) throw new Error(j.message || "خطأ");

    step1.style.display = "none";
    step2.style.display = "block";

    // ✅ بدل عرض الرمز: رسالة عامة
   // hint.textContent = "تم إرسال رمز التحقق (تجريبي: راجعي التيرمنال).";

  } catch (e) {
    showError(e.message);
  }
});

document.getElementById("verifyOtp").addEventListener("click", async () => {
  showError("");
  const phone = document.getElementById("phone").value.trim();
  const code = document.getElementById("otp").value.trim();

  try {
    const r = await fetch("http://127.0.0.1:3001/api/auth/login/verify", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      credentials: "include",
      body: JSON.stringify({ phone, code })
    });

    const j = await r.json().catch(()=> ({}));
    if (!r.ok) throw new Error(j.message || "خطأ");

    localStorage.setItem("user", JSON.stringify(j.user));
    window.location.href = j.redirect;

  } catch (e) {
    showError(e.message);
  }
});
</script>

</body>
</html>
